@media (prefers-reduced-motion: reduce) { .slide.on .kb { animation: none; } }
</style>

<script>
const W = 1376, H = 768;
const SLIDES = [
  { img: "img/1.webp?v=10", fx: 0, kicker: "Age 13 · The spark", title: "The Path of an Engineer", lesson: "It starts with one question: what happens if…?", accent: "#ffb547", portal: [0.6, 0.68] },

  { img: "img/2.webp?v=10", fx: 2, kicker: "His 20s · Structural engineer", title: "A Structural Engineer Who Coded on a Game Console", lesson: "Use the tools you have, not the ones you wish you had.", accent: "#6cffc9", portal: [0.245, 0.42] },

/* HUD page content: editable text over diagram panels cut from the original deck (positions in 1600×900 units) */

const crop = (src, x, y, w) => `<img class="crop" src="img/detail/${src}.webp" alt="" style="left:${u(x)};top:${u(y)};width:${u(w)}">`;

const page = o => `<div class="hud">

const DOCS = {
  icbc: page({

    chip: "INFRASTRUCTURE // ICBC DATA SCIENCE",

const DW = 1600, DH = 900;
const dims = sl => sl.doc ? [DW, DH] : [W, H];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

/* ---------- ambient effects, drawn in image pixels (1376×768) ---------- */
function glow(ctx, x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace("A", a)); g.addColorStop(1, color.replace("A", 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function twinklers(n, x0, x1, y0, y1) {
  return Array.from({ length: n }, () => ({ x: rand(x0, x1), y: rand(y0, y1), p: rand(0, TAU), s: rand(.6, 1.8), r: rand(.8, 2.2) }));
}
function drift(n, x0, x1, y0, y1, v) {
  return Array.from({ length: n }, () => ({ x: rand(x0, x1), y: rand(y0, y1), vx: rand(-v, v), vy: rand(-v, v * .3), p: rand(0, TAU), r: rand(1, 3) }));
}
function moveDrift(list, dt, x0, x1, y0, y1) {

  glow(ctx, 87, 46, 12, "rgba(56,216,255,A)", .4 + .4 * Math.sin(t * 4));
}
function cursor(ctx, t, x, y, h, color) {
  if (Math.floor(t * 1.8) % 2 === 0) { ctx.fillStyle = color; ctx.fillRect(x, y - h, 9, h); }
}
const HUDS = [
  // ICBC: telemetry packets flow from hubs into the core risk engine, rack lights blink
  {
    init() { return {}; },
    draw(ctx, s, t) {
      hudBase(ctx, t);
      const p = .5 + .5 * Math.sin(t * 2.2);
      glow(ctx, 1160, 365, 120, "rgba(56,216,255,A)", .12 + .12 * p);
      glow(ctx, 1160, 365, 22, "rgba(180,245,255,A)", .5 + .4 * p);
      ring(ctx, 1160, 365, t * .5, "rgba(56,216,255,A)");
      for (let i = 0; i < 3; i++) {
        packet(ctx, 893, 676, 1100, 425, (t * .45 + i / 3) % 1, "rgba(56,216,255,A)");
        packet(ctx, 1286, 676, 1205, 440, (t * .38 + i / 3) % 1, "rgba(170,130,255,A)");
      }
      [247, 278, 308, 338, 368].forEach((y, i) => {
        glow(ctx, 866, y, 9, "rgba(120,255,200,A)", Math.max(0, Math.sin(t * 3 + i * 1.7)) * .7);
        glow(ctx, 1455, y, 9, "rgba(56,216,255,A)", Math.max(0, Math.sin(t * 2.6 + i * 2.1)) * .7);
      });
      ring(ctx, 893, 676, t * .5 + .3, "rgba(56,216,255,A)");
      ring(ctx, 1286, 676, t * .5 + .8, "rgba(170,130,255,A)");
    },
  },
  // InfraLogics PINN: a forward pass ripples through the network into the physics box
  {
    init() { return {}; },
    draw(ctx, s, t) {
      hudBase(ctx, t);
      ctx.translate(0, 138); // diagram is centred on the page, 138 units below its original spot
      const layers = [[[893, 213], [893, 313], [893, 413]], [[1043, 180], [1043, 266], [1043, 352], [1043, 438]], [[1203, 230], [1203, 340], [1203, 428]]];
      const wave = (t * .7) % 1.4;
      layers.forEach((layer, li) => {
        const a = Math.max(0, 1 - Math.abs(wave - li * .35) * 3.5);
        layer.forEach(([x, y]) => glow(ctx, x, y, 30, "rgba(56,216,255,A)", .15 + .6 * a));
      });
      const boxA = Math.max(0, 1 - Math.abs(wave - 1.1) * 3.5);
      for (const [x, y] of [[1383, 200], [1270, 340], [1383, 430]]) glow(ctx, x, y, 16, "rgba(255,194,61,A)", .3 + .6 * boxA);
      glow(ctx, 1383, 315, 150, "rgba(255,194,61,A)", .04 + .1 * boxA);
    },
  },
  // Games: the twin mesh takes its load, sensor nodes ping, the use-case tiles light in turn
  {
    init() { return {}; },
    draw(ctx, s, t) {
      hudBase(ctx, t);
      const tiles = [[980, 166], [1342, 166], [980, 318], [1342, 318]];
      const lit = Math.floor(t / 1.6) % 4;
      tiles.forEach(([x, y], i) => glow(ctx, x, y, 170, "rgba(56,216,255,A)", i === lit ? .07 : 0));
      const p = .5 + .5 * Math.sin(t * 3);
      glow(ctx, 1160, 512, 26, "rgba(255,194,61,A)", .4 + .4 * p);
      packet(ctx, 1160, 520, 1160, 628, (t * .6) % 1, "rgba(255,194,61,A)");
      ring(ctx, 1013, 621, t * .6, "rgba(56,216,255,A)");
      ring(ctx, 1306, 621, t * .6 + .5, "rgba(60,230,150,A)");
      glow(ctx, 1160, 620, 170, "rgba(56,216,255,A)", .04 + .04 * p);
    },
  },
  // P.Eng: the seal turns, signals run in from the digital and physical sides
  {
    init() { return {}; },
    draw(ctx, s, t) {
      hudBase(ctx, t);
      ctx.translate(0, 131); // diagram is centred on the page, 131 units below its original spot
      ctx.save();
      ctx.translate(1160, 310);
      ctx.lineWidth = 2; ctx.setLineDash([14, 18]);
      ctx.rotate(t * .25); ctx.strokeStyle = "rgba(56,216,255,.45)"; ctx.beginPath(); ctx.arc(0, 0, 150, 0, TAU); ctx.stroke();
      ctx.rotate(-t * .55); ctx.strokeStyle = "rgba(255,194,61,.4)"; ctx.beginPath(); ctx.arc(0, 0, 196, 0, TAU); ctx.stroke();
      ctx.restore();
      const p = .5 + .5 * Math.sin(t * 2);
      glow(ctx, 1160, 310, 60, "rgba(255,230,160,A)", .25 + .3 * p);
      glow(ctx, 1160, 310, 230, "rgba(255,194,61,A)", .04 + .06 * p);
      for (let i = 0; i < 2; i++) {
        const k = (t * .4 + i / 2) % 1;
        packet(ctx, 850, 310, 1062, 310, k, "rgba(56,216,255,A)");
        packet(ctx, 1470, 310, 1258, 310, k, "rgba(255,194,61,A)");
      }
    },
  },
];
const FX = SLIDES.map(sl => sl.doc ? HUDS[sl.hud] : EFFECTS[sl.fx]);

/* ---------- build slides ---------- */
const stage = document.getElementById("stage");
const els = SLIDES.map((sl, i) => {
  const el = document.createElement("section");
  el.className = sl.doc ? "slide doc" : "slide"; el.setAttribute("aria-label", `Slide ${i + 1} of ${SLIDES.length}: ${sl.title}`);
  el.innerHTML = sl.doc
    ? `<div class="backdrop"></div>
    <div class="frame"><div class="kb">${DOCS[sl.doc]}<canvas></canvas></div><div class="scan"></div></div>`
    : `<div class="backdrop" style="background-image:url('${sl.img.replace(/^img\/(\w+)\.webp.*/, "img/bg/$1.jpg")}')"></div>
    <div class="frame"><div class="kb" style="transform-origin:${sl.portal[0] * 100}% ${sl.portal[1] * 100}%">
      <img src="${sl.img}" alt="" ${i ? 'loading="eager"' : ""}><canvas></canvas></div><div class="vignette"></div></div>`;
  stage.prepend(el);
  return el;
});
const canvases = els.map(el => el.querySelector("canvas"));
const states = FX.map(e => e.init());

function sizeCanvases() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvases.forEach((c, i) => {
    const [w0, h0] = dims(SLIDES[i]);
    const w = c.clientWidth || c.parentElement.clientWidth;
    c.width = Math.round(w * dpr); c.height = Math.round(w * dpr * h0 / w0);
  });
}
addEventListener("resize", sizeCanvases);

/* ---------- navigation ---------- */
let cur = 0, busy = false;
const progress = document.getElementById("progress");
SLIDES.forEach((sl, i) => {
  const b = document.createElement("button");
  b.dataset.sub = sl.doc ? "sub" : "";
  b.setAttribute("aria-label", `Go to slide ${i + 1}: ${sl.title}`);
  b.onclick = () => go(i);
  progress.append(b);
});
const caption = document.getElementById("caption");

function setCaption(i) {
  const sl = SLIDES[i];
  stage.style.setProperty("--accent", sl.accent);
  caption.classList.toggle("away", !!sl.doc);
  if (!sl.doc) {
    document.getElementById("kicker").textContent = `${String(i + 1).padStart(2, "0")} / ${String(SLIDES.length).padStart(2, "0")} · ${sl.kicker}`;
    document.getElementById("title").innerHTML = sl.title.split(" ").map((w, k) => `<span class="w" style="--i:${k}">${w.replace(/&/g, "&amp;")}</span>`).join(" ");
    document.getElementById("lesson").textContent = sl.lesson;
    caption.classList.remove("in"); void caption.offsetWidth; caption.classList.add("in");
  }
  document.getElementById("count").innerHTML = `<b>${i + 1}</b> / ${SLIDES.length}`;
  [...progress.children].forEach((b, k) => { b.className = `${k < i ? "done" : k === i ? "cur" : ""} ${b.dataset.sub}`; b.toggleAttribute("aria-current", k === i); });
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === SLIDES.length - 1;
}

function go(n) {
  if (busy || n === cur || n < 0 || n >= SLIDES.length) return;
  document.getElementById("hint").classList.add("gone");
  const out = els[cur], inn = els[n], fwd = n > cur;
  const from = SLIDES[cur], to = SLIDES[n];
  busy = true;
  inn.classList.add("on");
  const dur = reduce ? 450 : 1500, easing = "cubic-bezier(.65,0,.3,1)";
  let aOut, aIn;
  const origin = sl => `${sl.portal[0] * 100}% ${sl.portal[1] * 100}%`;
  if (reduce) {
    aOut = out.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur });
    aIn = inn.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur });
  } else if (from.doc || to.doc) {
    // into a detail page: the scene dives into its focal point and cools to the HUD's cyan
    if (!from.doc) {
      out.style.transformOrigin = origin(from);
      aOut = out.animate(fwd
        ? [{ transform: "scale(1)", opacity: 1, filter: "saturate(1)" }, { transform: "scale(2.8)", opacity: 0, filter: "saturate(.2) hue-rotate(160deg) brightness(.6)" }]
        : [{ transform: "scale(1)", opacity: 1, filter: "brightness(1)" }, { transform: "scale(.55)", opacity: 0, filter: "brightness(.7)" }],
        { duration: dur * .8, easing });
    } else {
      // out of a detail page: it powers down like a monitor, collapsing to a bright line
      out.style.transformOrigin = "50% 50%";
      aOut = out.animate([
        { transform: "scale(1, 1)", opacity: 1, filter: "brightness(1)" },
        { offset: .45, transform: "scale(1, .006)", opacity: 1, filter: "brightness(2.6)" },
        { transform: "scale(0, .006)", opacity: 0, filter: "brightness(3)" },
      ], { duration: dur * .6, easing: "cubic-bezier(.5,0,.75,0)" });
    }
    if (to.doc) {
      // the detail page boots in behind a scan line sweeping down the screen
      inn.style.transformOrigin = origin(to);
      const delay = from.doc ? dur * .5 : dur * .45;
      aIn = inn.animate([
        { clipPath: "inset(0 0 100% 0)", transform: "scale(1.04)", filter: "brightness(1.8)" },
        { clipPath: "inset(0 0 0% 0)", transform: "scale(1)", filter: "brightness(1)" },
      ], { duration: dur * .75, delay, easing: "cubic-bezier(.3,0,.2,1)", fill: "backwards" });
      inn.querySelector(".scan").animate([
        { top: "0%", opacity: 1 }, { offset: .9, top: "100%", opacity: 1 }, { top: "100%", opacity: 0 },
      ], { duration: dur * .75, delay, easing: "cubic-bezier(.3,0,.2,1)" });
    } else {
      // back to a scene: it zooms up out of its focal point, as between scenes
      inn.style.transformOrigin = fwd ? "50% 50%" : origin(to);
      aIn = inn.animate(fwd
        ? [{ transform: "scale(.55)", opacity: 0, filter: "brightness(.7)" }, { transform: "scale(1)", opacity: 1, filter: "brightness(1)" }]
        : [{ transform: "scale(4)", opacity: 0, filter: "brightness(1.6)" }, { transform: "scale(1)", opacity: 1, filter: "brightness(1)" }],
        { duration: dur, delay: dur * .4, easing, fill: "backwards" });
    }
  } else if (fwd) {
    // push through the current scene's focal point and keep zooming into the next one
    out.style.transformOrigin = `${from.portal[0] * 100}% ${from.portal[1] * 100}%`;
    inn.style.transformOrigin = "50% 50%";
    aOut = out.animate([{ transform: "scale(1)", opacity: 1, filter: "brightness(1)" }, { transform: "scale(4)", opacity: 0, filter: "brightness(1.6)" }], { duration: dur, easing });
    aIn = inn.animate([{ transform: "scale(.55)", opacity: 0, filter: "brightness(.7)" }, { transform: "scale(1)", opacity: 1, filter: "brightness(1)" }], { duration: dur, easing, delay: dur * .18 });
  } else {
    // pull back out of the previous scene's focal point
    inn.style.transformOrigin = `${to.portal[0] * 100}% ${to.portal[1] * 100}%`;
    out.style.transformOrigin = "50% 50%";
    aOut = out.animate([{ transform: "scale(1)", opacity: 1, filter: "brightness(1)" }, { transform: "scale(.55)", opacity: 0, filter: "brightness(.7)" }], { duration: dur, easing });
    aIn = inn.animate([{ transform: "scale(4)", opacity: 0, filter: "brightness(1.6)" }, { transform: "scale(1)", opacity: 1, filter: "brightness(1)" }], { duration: dur, easing, delay: dur * .12, fill: "backwards" });
  }
  if (!reduce && fwd && !from.doc && !to.doc) aIn.effect.updateTiming({ fill: "backwards" });
  // hold the outgoing slide at its end state, then retire it, so it never snaps back into view
  aOut.effect.updateTiming({ fill: "forwards" });
  aOut.finished.then(() => { out.classList.remove("on"); aOut.cancel(); });
  setTimeout(() => setCaption(n), dur * .45);
  Promise.all([aOut.finished, aIn.finished]).then(() => { cur = n; busy = false; });
  cur = n;
}

addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(SLIDES.length - 1);
  if (e.key === "f") toggleFs();
});
document.getElementById("next").onclick = () => go(cur + 1);
document.getElementById("prev").onclick = () => go(cur - 1);
stage.addEventListener("click", e => {
  if (e.target.closest("button, a")) return;
  go(e.clientX > innerWidth / 3 ? cur + 1 : cur - 1);
});
let tx = null;
stage.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 40) { go(dx < 0 ? cur + 1 : cur - 1); }
});
function toggleFs() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (_) {}
}
document.getElementById("fs").onclick = toggleFs;

/* ---------- render loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  els.forEach((el, i) => {
    if (!el.classList.contains("on")) return;
    const c = canvases[i], ctx = c.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, c.width, c.height);
    const k = c.width / dims(SLIDES[i])[0];
    ctx.setTransform(k, 0, 0, k, 0, 0);
    FX[i].draw(ctx, states[i], t, dt);
  });
  requestAnimationFrame(frame);
}

els[0].classList.add("on");
setCaption(0);
sizeCanvases();
if (!reduce) requestAnimationFrame(frame);
</script>
